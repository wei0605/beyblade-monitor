<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>戰鬥陀螺 雲端極速監控系統</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 50px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    /* Header */
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--card-bg); border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border); }
    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-icon { font-size: 24px; color: #60a5fa; }
    .app-title { font-size: 16px; font-weight: bold; }
    .app-subtitle { font-size: 11px; color: var(--text-muted); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .badge-status { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
    .badge-running { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-stopped { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .btn-settings-toggle { background: #334155; color: #cbd5e1; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; border: none; }

    /* Control Bar */
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    button { padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
    .btn-start { background: #059669; color: white; }
    .btn-start:active { background: #047857; }
    .btn-stop { background: #dc2626; color: white; }
    .btn-stop:active { background: #b91c1c; }
    .btn-check { background: #2563eb; color: white; }
    .btn-check:active { background: #1d4ed8; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .stat-card { background: var(--card-bg); padding: 10px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
    .stat-val { font-size: 18px; font-weight: bold; color: #60a5fa; }
    .stat-lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* Settings Panel */
    .settings-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; display: none; }
    .settings-panel.active { display: block; }
    .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .settings-title { font-size: 14px; font-weight: bold; color: #60a5fa; display: flex; align-items: center; gap: 6px; }
    .switch-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .switch-label { font-size: 13px; color: #f1f5f9; display: flex; align-items: center; gap: 8px; }
    
    /* Toggle Switch */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(20px); }

    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; display: block; }
    .form-input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 13px; }
    .input-with-btn { display: flex; gap: 8px; }
    .btn-test { background: #334155; color: white; padding: 8px 12px; border-radius: 8px; font-size: 12px; white-space: nowrap; }
    .btn-save-settings { width: 100%; background: #2563eb; color: white; padding: 10px; font-size: 13px; font-weight: bold; border-radius: 8px; margin-top: 8px; }

    /* Section Header */
    .section-title { font-size: 14px; font-weight: 600; margin: 16px 4px 8px 4px; display: flex; align-items: center; justify-content: space-between; }
    .btn-add-item { background: #059669; color: white; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }

    /* Item Card */
    .item-card { background: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid var(--border); position: relative; }
    .item-card.in-stock { border-color: var(--success); background: rgba(16, 185, 129, 0.05); }
    .item-card.disabled { opacity: 0.6; }
    .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .item-name { font-size: 14px; font-weight: 600; color: #f1f5f9; line-height: 1.4; flex: 1; padding-right: 8px; }
    .item-asin { font-size: 11px; font-family: monospace; color: var(--text-muted); background: #0f172a; padding: 2px 6px; border-radius: 4px; }
    .item-note { font-size: 11px; color: #94a3b8; margin-bottom: 6px; }
    .item-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .item-status { font-size: 12px; font-weight: 600; }
    .item-price { font-size: 15px; font-weight: bold; color: #f59e0b; }
    
    .item-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .btn-buy { flex: 2; background: #ea580c; color: white; font-size: 12px; padding: 8px; text-decoration: none; border-radius: 8px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 4px; font-weight: bold; min-width: 130px; }
    .btn-buy:active { background: #c2410c; }
    .item-btn { background: #334155; color: #cbd5e1; font-size: 12px; padding: 8px 10px; border-radius: 8px; cursor: pointer; flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .item-btn.active { background: #0284c7; color: white; }
    .btn-edit { background: #475569; }
    .btn-delete { background: #991b1b; color: #fecaca; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); display: none; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 450px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-title { font-size: 16px; font-weight: bold; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; color: #60a5fa; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn-modal-cancel { flex: 1; background: #475569; color: white; padding: 10px; border-radius: 8px; font-size: 13px; }
    .btn-modal-confirm { flex: 1; background: #059669; color: white; padding: 10px; border-radius: 8px; font-size: 13px; }

    /* Log Box */
    .log-box { background: #090d16; border: 1px solid var(--border); border-radius: 10px; padding: 10px; height: 160px; overflow-y: auto; font-family: monospace; font-size: 11px; line-height: 1.5; color: #cbd5e1; }
    .log-entry { margin-bottom: 4px; }
    .log-time { color: #64748b; margin-right: 4px; }
    .log-SUCCESS { color: #34d399; font-weight: bold; }
    .log-WARNING { color: #fbbf24; }
    .log-ERROR { color: #f87171; font-weight: bold; }
    .log-INFO { color: #94a3b8; }

    /* Footer Note */
    .footer-note { text-align: center; font-size: 11px; color: #64748b; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo-area">
        <i class="fa-solid fa-hurricane logo-icon"></i>
        <div>
          <div class="app-title">戰鬥陀螺 雲端極速監控</div>
          <div class="app-subtitle">Amazon.co.jp 24H 官方秒殺</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-settings-toggle" onclick="toggleSettingsPanel()">
          <i class="fa-solid fa-gear"></i> 設定
        </button>
        <div id="statusBadge" class="badge-status badge-stopped">
          <i class="fa-solid fa-circle" style="font-size: 8px;"></i> <span id="statusText">載入中...</span>
        </div>
      </div>
    </header>

    <!-- Settings Panel (Collapsible) -->
    <div id="settingsPanel" class="settings-panel">
      <div class="settings-header">
        <div class="settings-title"><i class="fa-solid fa-sliders"></i> 雲端推播與全域設定</div>
        <button onclick="toggleSettingsPanel()" style="background: transparent; color: #94a3b8; font-size: 13px; padding: 0;">✕ 關閉</button>
      </div>

      <!-- Notification Toggles -->
      <div class="switch-row">
        <div class="switch-label"><i class="fa-brands fa-discord" style="color: #5865F2;"></i> 啟用 Discord 推播通知</div>
        <label class="switch">
          <input type="checkbox" id="settingEnableDiscord">
          <span class="slider"></span>
        </label>
      </div>

      <div class="switch-row">
        <div class="switch-label"><i class="fa-brands fa-line" style="color: #06C755;"></i> 啟用 LINE 官方帳號推播</div>
        <label class="switch">
          <input type="checkbox" id="settingEnableLine">
          <span class="slider"></span>
        </label>
      </div>

      <div class="switch-row">
        <div class="switch-label"><i class="fa-solid fa-shield-halved" style="color: #f59e0b;"></i> 僅 Amazon 官方自營才警報 (防黃牛)</div>
        <label class="switch">
          <input type="checkbox" id="settingOnlyAmazon">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Interval Input -->
      <div class="form-group">
        <label class="form-label">檢查間隔 (秒，建議 3~8 秒):</label>
        <input type="number" id="settingInterval" class="form-input" min="2" max="300" value="5">
      </div>

      <!-- Discord Webhook Input -->
      <div class="form-group">
        <label class="form-label">Discord Webhook 網址:</label>
        <div class="input-with-btn">
          <input type="text" id="settingDiscordUrl" class="form-input" placeholder="https://discord.com/api/webhooks/...">
          <button class="btn-test" onclick="testDiscord()"><i class="fa-solid fa-paper-plane"></i> 測試</button>
        </div>
      </div>

      <!-- LINE Token Input -->
      <div class="form-group">
        <label class="form-label">LINE Token 或 Channel ID:Secret:</label>
        <div class="input-with-btn">
          <input type="text" id="settingLineToken" class="form-input" placeholder="Channel ID:Secret 或 Access Token">
          <button class="btn-test" onclick="testLine()"><i class="fa-solid fa-paper-plane"></i> 測試</button>
        </div>
      </div>

      <button class="btn-save-settings" onclick="saveSettings()">
        <i class="fa-solid fa-floppy-disk"></i> 儲存設定
      </button>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="toggleMonitorBtn" class="btn-start" onclick="toggleMonitoring()">
        <i class="fa-solid fa-play"></i> <span id="btnActionText">啟動雲端監控</span>
      </button>
      <button class="btn-check" onclick="checkAllNow()">
        <i class="fa-solid fa-bolt"></i> 立即全檢 (秒查)
      </button>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div id="statTotal" class="stat-val">11</div>
        <div class="stat-lbl">追蹤商品</div>
      </div>
      <div class="stat-card">
        <div id="statInStock" class="stat-val" style="color: #34d399;">0</div>
        <div class="stat-lbl">官方現貨</div>
      </div>
      <div class="stat-card">
        <div id="statInterval" class="stat-val">5s</div>
        <div class="stat-lbl">檢查間隔</div>
      </div>
    </div>

    <!-- Items List Header -->
    <div class="section-title">
      <span><i class="fa-solid fa-list-check"></i> 監控陀螺清單 (<span id="activeCount">0</span> 啟用)</span>
      <button class="btn-add-item" onclick="openAddModal()">
        <i class="fa-solid fa-plus"></i> 新增商品
      </button>
    </div>
    <div id="itemsContainer">
      <!-- Dynamic Item Cards -->
    </div>

    <!-- Real-time Logs -->
    <div class="section-title">
      <span><i class="fa-solid fa-terminal"></i> 即時日誌紀錄</span>
      <button onclick="clearLogs()" style="background: transparent; color: #64748b; font-size: 11px; padding: 2px 6px;">清空日誌</button>
    </div>
    <div id="logBox" class="log-box">
      <div class="log-entry"><span class="log-time">[系統]</span> 連線至雲端伺服器中...</div>
    </div>

    <div class="footer-note">
      Amazon Japan Beyblade X Monitor • 支援 LINE & Discord 雙向秒殺推播
    </div>
  </div>

  <!-- Add / Edit Modal -->
  <div id="itemModal" class="modal-overlay">
    <div class="modal-box">
      <div id="modalTitle" class="modal-title">
        <i class="fa-solid fa-plus-circle"></i> 新增戰鬥陀螺監控品項
      </div>
      <input type="hidden" id="modalItemIndex" value="-1">
      
      <div class="form-group">
        <label class="form-label">商品型號 / 名稱 (必填):</label>
        <input type="text" id="modalItemName" class="form-input" placeholder="例如：BX-53 全套組">
      </div>

      <div class="form-group">
        <label class="form-label">Amazon 網址 或 10碼 ASIN (必填):</label>
        <input type="text" id="modalItemAsin" class="form-input" placeholder="例如：B0HJ783F18 或 商品網址">
      </div>

      <div class="form-group">
        <label class="form-label">備註 (選填):</label>
        <input type="text" id="modalItemNote" class="form-input" placeholder="例如：10月預購主力款">
      </div>

      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeModal()">取消</button>
        <button class="btn-modal-confirm" onclick="confirmSaveItem()">確定儲存</button>
      </div>
    </div>
  </div>

  <script>
    let isRunning = false;
    let itemsData = [];
    let configData = {};

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        
        isRunning = data.is_monitoring;
        itemsData = data.items || [];
        configData = data;
        
        // Update Status Badge & Button
        const badge = document.getElementById('statusBadge');
        const text = document.getElementById('statusText');
        const btn = document.getElementById('toggleMonitorBtn');

        if (isRunning) {
          badge.className = 'badge-status badge-running';
          text.innerText = '極速監控中';
          btn.className = 'btn-stop';
          btn.innerHTML = '<i class="fa-solid fa-stop"></i> 暫停雲端監控';
        } else {
          badge.className = 'badge-status badge-stopped';
          text.innerText = '監控已暫停';
          btn.className = 'btn-start';
          btn.innerHTML = '<i class="fa-solid fa-play"></i> 啟動雲端監控';
        }

        // Stats
        document.getElementById('statTotal').innerText = itemsData.length;
        document.getElementById('statInterval').innerText = (data.interval_seconds || 5) + 's';
        
        let inStockCount = 0;
        let activeCount = 0;
        itemsData.forEach(it => {
          if (it.enabled !== false) activeCount++;
          if (it.last_status && it.last_status.includes('官方現貨')) inStockCount++;
        });
        document.getElementById('statInStock').innerText = inStockCount;
        document.getElementById('activeCount').innerText = activeCount;

        renderItems(itemsData);
        updateLogs(data.logs || []);

        // Sync Settings fields if not actively typing
        if (!document.getElementById('settingsPanel').classList.contains('user-editing')) {
          document.getElementById('settingEnableDiscord').checked = data.enable_discord !== false;
          document.getElementById('settingEnableLine').checked = data.enable_line !== false;
          document.getElementById('settingOnlyAmazon').checked = data.only_amazon_seller !== false;
          document.getElementById('settingInterval').value = data.interval_seconds || 5;
          if (!document.getElementById('settingDiscordUrl').value) {
            document.getElementById('settingDiscordUrl').value = data.discord_webhook || '';
          }
          if (!document.getElementById('settingLineToken').value) {
            document.getElementById('settingLineToken').value = data.line_token || '';
          }
        }
      } catch (e) {
        console.error("Fetch status error:", e);
      }
    }

    function renderItems(items) {
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      items.forEach((it, idx) => {
        const card = document.createElement('div');
        const isInStock = it.last_status && it.last_status.includes('官方現貨');
        const isEnabled = it.enabled !== false;
        card.className = `item-card ${isInStock ? 'in-stock' : ''} ${!isEnabled ? 'disabled' : ''}`;
        
        card.innerHTML = `
          <div class="item-header">
            <div class="item-name">${escapeHtml(it.name)}</div>
            <span class="item-asin">${escapeHtml(it.asin || '-')}</span>
          </div>
          ${it.note ? `<div class="item-note"><i class="fa-regular fa-bookmark"></i> ${escapeHtml(it.note)}</div>` : ''}
          <div class="item-meta">
            <div>
              <div class="item-status" style="color: ${isInStock ? '#34d399' : '#94a3b8'}">${escapeHtml(it.last_status || '待檢查')}</div>
              <div style="font-size: 11px; color: #64748b; margin-top: 2px;">賣家: ${escapeHtml(it.last_seller || '-')} | 時間: ${escapeHtml(it.last_time || '-')}</div>
            </div>
            <div class="item-price">${escapeHtml(it.last_price || '-')}</div>
          </div>
          <div class="item-actions">
            <button class="item-btn ${isEnabled ? 'active' : ''}" onclick="toggleItem(${idx})">
              ${isEnabled ? '☑ 監控中' : '☐ 略過'}
            </button>
            <button class="item-btn btn-edit" onclick="openEditModal(${idx})">
              <i class="fa-solid fa-pen"></i> 編輯
            </button>
            <button class="item-btn btn-delete" onclick="deleteItem(${idx})">
              <i class="fa-solid fa-trash"></i> 刪除
            </button>
            <a href="https://www.amazon.co.jp/dp/${it.asin}?m=AN1VRQENFRJN5&th=1&psc=1" target="_blank" class="btn-buy">
              <i class="fa-solid fa-cart-shopping"></i> 1-Click 官方直達
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateLogs(logs) {
      const box = document.getElementById('logBox');
      if (!logs || logs.length === 0) return;
      box.innerHTML = '';
      logs.forEach(l => {
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.innerHTML = `<span class="log-time">[${l.time}]</span> <span class="log-${l.level}">${escapeHtml(l.msg)}</span>`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    function toggleSettingsPanel() {
      const p = document.getElementById('settingsPanel');
      p.classList.toggle('active');
    }

    async function saveSettings() {
      const payload = {
        enable_discord: document.getElementById('settingEnableDiscord').checked,
        enable_line: document.getElementById('settingEnableLine').checked,
        only_amazon_seller: document.getElementById('settingOnlyAmazon').checked,
        interval_seconds: parseInt(document.getElementById('settingInterval').value) || 5,
        discord_webhook: document.getElementById('settingDiscordUrl').value.trim(),
        line_token: document.getElementById('settingLineToken').value.trim()
      };

      try {
        const res = await fetch('/api/settings', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.ok) {
          alert("✅ 設定已成功儲存！");
          fetchStatus();
        } else {
          alert("❌ 儲存失敗: " + (data.msg || "未知錯誤"));
        }
      } catch (e) {
        alert("網路錯誤: " + e);
      }
    }

    async function testDiscord() {
      const url = document.getElementById('settingDiscordUrl').value.trim();
      if (!url) { alert("請先填寫 Discord Webhook 網址！"); return; }
      try {
        const res = await fetch('/api/test_discord', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ webhook_url: url })
        });
        const data = await res.json();
        alert(data.msg);
      } catch (e) {
        alert("測試發送失敗: " + e);
      }
    }

    async function testLine() {
      const token = document.getElementById('settingLineToken').value.trim();
      if (!token) { alert("請先填寫 LINE Token 或 Channel ID:Secret！"); return; }
      try {
        const res = await fetch('/api/test_line', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ line_token: token })
        });
        const data = await res.json();
        alert(data.msg);
      } catch (e) {
        alert("測試發送失敗: " + e);
      }
    }

    // Item Add / Edit Modal Logic
    function openAddModal() {
      document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-plus-circle"></i> 新增戰鬥陀螺監控品項';
      document.getElementById('modalItemIndex').value = '-1';
      document.getElementById('modalItemName').value = '';
      document.getElementById('modalItemAsin').value = '';
      document.getElementById('modalItemNote').value = '';
      document.getElementById('itemModal').classList.add('active');
    }

    function openEditModal(idx) {
      const item = itemsData[idx];
      if (!item) return;
      document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> 編輯商品資料';
      document.getElementById('modalItemIndex').value = idx;
      document.getElementById('modalItemName').value = item.name || '';
      document.getElementById('modalItemAsin').value = item.asin || '';
      document.getElementById('modalItemNote').value = item.note || '';
      document.getElementById('itemModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('itemModal').classList.remove('active');
    }

    async function confirmSaveItem() {
      const idx = parseInt(document.getElementById('modalItemIndex').value);
      const name = document.getElementById('modalItemName').value.trim();
      const asin = document.getElementById('modalItemAsin').value.trim();
      const note = document.getElementById('modalItemNote').value.trim();

      if (!name) { alert("請輸入商品型號或名稱！"); return; }
      if (!asin) { alert("請輸入 Amazon 網址或 ASIN！"); return; }

      const isEdit = idx >= 0;
      const endpoint = isEdit ? '/api/edit_item' : '/api/add_item';
      const payload = isEdit ? { index: idx, name, asin, note } : { name, asin, note };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.ok) {
          closeModal();
          fetchStatus();
        } else {
          alert("儲存失敗: " + (data.msg || "未知錯誤"));
        }
      } catch (e) {
        alert("請求失敗: " + e);
      }
    }

    async function deleteItem(idx) {
      const item = itemsData[idx];
      if (!item) return;
      if (!confirm(`確定要刪除「${item.name}」嗎？`)) return;

      try {
        const res = await fetch(`/api/delete_item?index=${idx}`, { method: 'POST' });
        const data = await res.json();
        if (data.ok) {
          fetchStatus();
        } else {
          alert("刪除失敗: " + (data.msg || "未知錯誤"));
        }
      } catch (e) {
        alert("刪除請求失敗: " + e);
      }
    }

    async function toggleMonitoring() {
      const action = isRunning ? 'stop' : 'start';
      try {
        await fetch(`/api/${action}`, { method: 'POST' });
        fetchStatus();
      } catch (e) {
        alert("操作失敗: " + e);
      }
    }

    async function checkAllNow() {
      try {
        await fetch('/api/check_now', { method: 'POST' });
        fetchStatus();
      } catch (e) {
        alert("檢查失敗: " + e);
      }
    }

    async function toggleItem(idx) {
      try {
        await fetch(`/api/toggle_item?index=${idx}`, { method: 'POST' });
        fetchStatus();
      } catch (e) {
        alert("切換失敗: " + e);
      }
    }

    function clearLogs() {
      document.getElementById('logBox').innerHTML = '';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Polling every 3.5 seconds
    fetchStatus();
    setInterval(fetchStatus, 3500);
  </script>
</body>
</html>
